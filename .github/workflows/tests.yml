name: Python tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr
      - run: python scripts/bootstrap.py --device cpu
      - run: .venv/bin/python -m pip install -r requirements-dev.txt -c constraints.txt
      - run: .venv/bin/python -m pytest -q
      - run: .venv/bin/python -m basketball_cv.cli demo --output /tmp/ci-demo
